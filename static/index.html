<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CityWatch AI — Municipal Hazard Reporting</title>
    <!-- Leaflet Map CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            display: flex; 
            height: 100vh; 
            height: 100dvh; 
            background: #f8fafc; 
            color: #1e293b; 
            overflow: hidden;
        }
        
        /* Mobile Tab Switcher (Hidden on Desktop & Landscape) */
        #mobileNav {
            display: none;
            width: 100%;
            background: #1e3a8a;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 2000;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .tab-btn {
            flex: 1;
            padding: 14px 10px;
            background: none;
            border: none;
            color: #93c5fd;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            border-bottom: 3px solid transparent;
            transition: all 0.2s ease;
        }
        .tab-btn.active {
            color: #ffffff;
            border-bottom: 3px solid #38bdf8;
            background: rgba(255, 255, 255, 0.08);
        }

        /* Sidebar Styling */
        #sidebar { 
            width: 440px; 
            background: #ffffff; 
            border-right: 1px solid #e2e8f0; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
            z-index: 1000; 
            box-shadow: 2px 0 10px rgba(0,0,0,0.05); 
        }
        .sidebar-header { padding: 20px; background: #1e3a8a; color: #ffffff; }
        .sidebar-header h1 { font-size: 20px; font-weight: 700; }
        .sidebar-header p { font-size: 13px; opacity: 0.85; margin-top: 4px; }
        
        .sidebar-content { padding: 20px; overflow-y: auto; flex: 1; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #475569; }
        .form-group input, .form-group textarea { width: 100%; padding: 11px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; }
        .coord-row { display: flex; gap: 8px; }
        
        button.btn-primary { width: 100%; padding: 13px; background: #2563eb; color: #ffffff; border: none; border-radius: 6px; font-weight: 700; font-size: 14px; cursor: pointer; }
        button.btn-primary:hover { background: #1d4ed8; }
        button.btn-gps { width: 100%; padding: 10px; background: #0ea5e9; color: #ffffff; border: none; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; margin-bottom: 8px; }
        button.btn-gps:hover { background: #0284c7; }

        /* Notification Alert */
        #resultAlert { display: none; margin-top: 16px; padding: 12px; border-radius: 6px; font-size: 13px; line-height: 1.4; }
        .alert-success { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
        .alert-duplicate { background: #fffbeb; color: #92400e; border: 1px solid #fde68a; }

        /* Map Styling */
        #map { flex: 1; height: 100%; }

        /* Badges */
        .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
        .badge-Critical { background: #fee2e2; color: #b91c1c; }
        .badge-Medium { background: #fef3c7; color: #b45309; }
        .badge-Low { background: #dcfce7; color: #15803d; }

        /* ==================================================== */
        /* RESPONSIVE STYLES FOR VERTICAL / MOBILE SCREENS      */
        /* ==================================================== */
        @media (max-width: 768px) and (orientation: portrait), (max-width: 600px) {
            body {
                flex-direction: column;
                padding-top: 48px; /* space for top tabs */
            }
            #mobileNav {
                display: flex;
            }
            .sidebar-header {
                display: none; /* saved space on mobile */
            }
            #sidebar {
                width: 100%;
                height: 100%;
                border-right: none;
            }
            #map {
                width: 100%;
                height: 100%;
                display: none; /* hidden until map tab is clicked */
            }
            /* When user switches to map view */
            body.show-map-view #sidebar {
                display: none;
            }
            body.show-map-view #map {
                display: block;
            }
        }
    </style>
</head>
<body>

    <!-- Mobile Top Navigation Tabs -->
    <div id="mobileNav">
        <button id="tabReport" class="tab-btn active" onclick="switchTab('report')">📝 Report Hazard</button>
        <button id="tabMap" class="tab-btn" onclick="switchTab('map')">🗺️ Live Map</button>
    </div>

    <!-- Citizen Report Panel -->
    <div id="sidebar">
        <div class="sidebar-header">
            <h1>🚧 CityWatch AI</h1>
            <p>Smart Municipal Hazard & Infrastructure Reporting</p>
        </div>

        <div class="sidebar-content">
            <form id="reportForm">
                <div class="form-group">
                    <label>Incident Location</label>
                    <button type="button" class="btn-gps" onclick="fetchCurrentGPS()">📍 Auto-Detect Current Location</button>
                    <div class="coord-row">
                        <input type="text" id="latitude" placeholder="Latitude" required readonly>
                        <input type="text" id="longitude" placeholder="Longitude" required readonly>
                    </div>
                    <small style="color: #64748b; font-size: 11px; margin-top: 4px; display: block;">Or switch to the map tab and tap anywhere to place a pin.</small>
                </div>

                <div class="form-group">
                    <label>Upload Incident Photo</label>
                    <input type="file" id="imageInput" accept="image/*" required>
                </div>

                <div class="form-group">
                    <label>Description / Additional Remarks</label>
                    <textarea id="notes" rows="3" placeholder="e.g. Deep road pothole near junction causing vehicle lane diversion"></textarea>
                </div>

                <button type="submit" id="submitBtn" class="btn-primary">Submit to AI Verification</button>
            </form>

            <div id="resultAlert"></div>
        </div>
    </div>

    <!-- Leaflet Interactive Map -->
    <div id="map"></div>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Initialize Map
        const map = L.map('map').setView([3.1390, 101.6869], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        let activeClickMarker = null;

        // Mobile Tab Switch Function
        function switchTab(view) {
            const reportBtn = document.getElementById('tabReport');
            const mapBtn = document.getElementById('tabMap');

            if (view === 'map') {
                document.body.classList.add('show-map-view');
                mapBtn.classList.add('active');
                reportBtn.classList.remove('active');
                // Refresh map size so Leaflet renders tiles properly
                setTimeout(() => { map.invalidateSize(); }, 200);
            } else {
                document.body.classList.remove('show-map-view');
                reportBtn.classList.add('active');
                mapBtn.classList.remove('active');
            }
        }

        // Auto-detect GPS coordinates
        function fetchCurrentGPS() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(position => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    updateFormCoordinates(lat, lon);
                    map.setView([lat, lon], 16);
                    alert("📍 GPS coordinates captured successfully!");
                }, () => alert("Unable to retrieve device GPS. Please grant browser location access."));
            }
        }

        // Tap on Map to select coordinates
        map.on('click', function(e) {
            updateFormCoordinates(e.latlng.lat, e.latlng.lng);
            // On mobile, ask user if they want to return to form
            if (window.innerWidth <= 768) {
                if (confirm("📍 Location pinned on map! Return to the report form?")) {
                    switchTab('report');
                }
            }
        });

        function updateFormCoordinates(lat, lon) {
            document.getElementById('latitude').value = lat.toFixed(6);
            document.getElementById('longitude').value = lon.toFixed(6);

            if (activeClickMarker) map.removeLayer(activeClickMarker);
            activeClickMarker = L.marker([lat, lon]).addTo(map).bindPopup("Selected Incident Point").openPopup();
        }

        // Fetch and plot reports
        async function loadReportMarkers() {
            try {
                const response = await fetch('/api/v1/reports');
                const json = await response.json();

                json.data.forEach(ticket => {
                    const markerColor = ticket.severity === 'Critical' ? '#ef4444' : (ticket.severity === 'Medium' ? '#f59e0b' : '#10b981');
                    
                    const marker = L.circleMarker([ticket.latitude, ticket.longitude], {
                        radius: 9,
                        fillColor: markerColor,
                        color: '#ffffff',
                        weight: 2,
                        opacity: 1,
                        fillOpacity: 0.9
                    }).addTo(map);

                    marker.bindPopup(`
                        <div style="min-width: 170px;">
                            <h4 style="margin: 0 0 6px 0;">${ticket.report_id}</h4>
                            <span class="badge badge-${ticket.severity}">${ticket.severity}</span>
                            <p style="margin: 6px 0; font-size: 13px;"><b>Defect:</b> ${ticket.hazard_type}</p>
                            <p style="margin: 4px 0; font-size: 12px; color: #475569;">${ticket.notes}</p>
                            <p style="margin: 4px 0; font-size: 12px;"><b>Merged:</b> ${ticket.duplicate_count}</p>
                            <img src="${ticket.image_url}" style="width: 100%; border-radius: 4px; margin-top: 6px; max-height: 110px; object-fit: cover;" />
                            <small style="color: #94a3b8; display: block; margin-top: 4px;">${ticket.submitted_at}</small>
                        </div>
                    `);
                });
            } catch (err) {
                console.error("Error loading spatial markers:", err);
            }
        }

        // Form Submit
        document.getElementById('reportForm').onsubmit = async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            const alertBox = document.getElementById('resultAlert');

            submitBtn.disabled = true;
            submitBtn.innerText = "⏳ YOLOv8 Verifying...";
            alertBox.style.display = "none";

            const formData = new FormData();
            formData.append("latitude", document.getElementById('latitude').value);
            formData.append("longitude", document.getElementById('longitude').value);
            formData.append("notes", document.getElementById('notes').value);
            formData.append("image", document.getElementById('imageInput').files[0]);

            try {
                const res = await fetch('/api/v1/report', {
                    method: 'POST',
                    body: formData
                });
                const result = await res.json();

                alertBox.style.display = "block";
                if (result.is_duplicate) {
                    alertBox.className = "alert-duplicate";
                    alertBox.innerHTML = `⚠️ <b>Duplicate Merged (10m Radius):</b> Merged into parent ticket: <b>${result.ticket.parent_report_id}</b>`;
                } else {
                    alertBox.className = "alert-success";
                    alertBox.innerHTML = `✅ <b>Success!</b> AI classified: <b>${result.ticket.hazard_type}</b> (${result.ticket.severity} Risk)`;
                }

                loadReportMarkers();

                // Switch to map on mobile after 1.5 seconds to view the new pin
                if (window.innerWidth <= 768) {
                    setTimeout(() => { switchTab('map'); }, 1500);
                }
            } catch (err) {
                alertBox.style.display = "block";
                alertBox.className = "alert-duplicate";
                alertBox.innerText = "Error: Unable to connect to server.";
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "Submit to AI Verification";
            }
        };

        // Load pins on boot
        loadReportMarkers();
    </script>
</body>
</html>
